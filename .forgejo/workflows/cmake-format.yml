---
name: Lint cmake-format

on:
  push:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # CMake Format
  cmake-format-linter:
    name: Lint Code Base (cmake-format-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Format CMake files
        id: cmake-format
        uses: https://github.com/PuneetMatharu/cmake-format-lint-action@960ee17edd4678e2793d49b96ae7608a91a78a5a
        with:
          args: --config-files ./github/linters/cmake-format.yaml
