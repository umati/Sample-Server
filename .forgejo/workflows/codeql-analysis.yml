---
name: "CodeQL"

on:
  push:
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [develop]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read
  discussions: read
  issues: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: write
  statuses: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    env:
      CMAKE_INSTALL_PREFIX: ${{ github.workspace }}/install

    strategy:
      fail-fast: false
      matrix:
        language: ["cpp", "python"]

    steps:
      - name: Checkout Sample-Server
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: docker://ghcr.io/github/codeql-action/init:v4
        with:
          languages: ${{ matrix.language }}

      - name: Build server with dependencies
        run: |
          mkdir -p build
          cd build
          cmake ../.github/ \
                -DCMAKE_INSTALL_PREFIX:PATH="${{ env.CMAKE_INSTALL_PREFIX }}"
          cmake --build .
      - name: Perform CodeQL Analysis
        uses: docker://ghcr.io/github/codeql-action/analyze:v4
