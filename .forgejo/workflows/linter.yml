---
name: Lint Code Base

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  super-linter:
    name: Lint Code Base (super-linter)
    permissions:
      contents: write
      statuses: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Lint Code Base
        # yamllint disable-line
        uses: docker://ghcr.io/super-linter/super-linter@sha256:5f36f6ff08fa41b4f4baf0f92dfb00081c1825a098908d344ddc8024084fde33 # v8.5.0-slim
        env:
          RUN_LOCAL: true
          VALIDATE_CPP: false # Use clang-format instead
          VALIDATE_ANSIBLE: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          FIX_MARKDOWN_PRETTIER: true
          FIX_YAML_PRETTIER: true
          FIX_JSON_PRETTIER: true
          FIX_SHELL_SHFMT: true
          FIX_CLANG_FORMAT: true
          FIX_PYTHON_RUFF_FORMAT: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          DEFAULT_BRANCH: origin/develop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
