---
name: Lint cmake-format

on:
  push:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # CMake Format
  cmake-format-linter:
    name: Lint Code Base (cmake-format-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Format CMake files
        id: cmake-format
        uses: PuneetMatharu/cmake-format-lint-action@v1.0.8
        with:
          args: --config-files ./.github/linters/cmake-format.yaml --in-place
