---
name: Lint Code Base

on:
  push:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  super-linter:
    # Name the Job
    name: Lint Code Base (super-linter)
    permissions:
      # To write linting fixes
      contents: write
      # To write Super-linter status checks
      statuses: write
    # Set the agent to run on
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          # Full git history is needed to get a proper list
          # of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: true

      - name: Lint Code Base
        uses: super-linter/super-linter@v8.4.0
        env:
          VALIDATE_CPP: false # Use clang-format instead
          VALIDATE_ANSIBLE: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          FIX_MARKDOWN_PRETTIER: true
          FIX_YAML_PRETTIER: true
          FIX_JSON_PRETTIER: true
          FIX_SHELL_SHFMT: true
          FIX_CLANG_FORMAT: true
          FIX_PYTHON_RUFF_FORMAT: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          DEFAULT_BRANCH: origin/develop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push linting fixes
        # Run only on:
        # - Pull requests
        # - Not on the default branch
        if: >
          github.event_name == 'pull_request' &&
          github.ref_name != github.event.repository.default_branch
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref }}
          commit_message: "chore: fix linting issues"
          commit_user_name: super-linter
          commit_user_email: super-linter@super-linter.dev

  # CMake Format
  cmake-format-linter:
    name: Lint Code Base (cmake-format-lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Format CMake files
        id: cmake-format
        uses: PuneetMatharu/cmake-format-lint-action@v1.0.6
        with:
          args: --config-files ./github/linters/cmake-format.yaml
